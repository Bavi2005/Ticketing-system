name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loyalty
          POSTGRES_PASSWORD: loyalty
          POSTGRES_DB: loyalty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loyalty -d loyalty_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://loyalty:loyalty@localhost:5432/loyalty_test?schema=public
      JWT_SECRET: ci-test-secret-not-a-real-secret-32
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Backend install
        run: npm ci
        working-directory: backend

      - name: Frontend install
        run: npm ci
        working-directory: frontend

      - name: Root install
        run: npm ci

      - name: Prisma migrate (clean test DB)
        run: npx prisma migrate deploy
        working-directory: backend

      - name: Backend tests (unit + integration + concurrency)
        run: npm test
        working-directory: backend

      - name: Frontend build
        run: npm run build
        working-directory: frontend
