name: loyalty-program

# Self-contained local run: Postgres + the full app (frontend, proxy, backend).
# Production (Render) instead uses the Dockerfile directly with a managed
# Postgres (Supabase) via DATABASE_URL.
services:
  app:
    build: .
    command: ["sh", "-c", "cd backend && npx prisma migrate deploy && node seed.js && cd .. && node start.js"]
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgresql://loyalty:loyalty@db:5432/loyalty?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-please-override-this-32chars}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loyalty
      POSTGRES_PASSWORD: loyalty
      POSTGRES_DB: loyalty
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyalty -d loyalty"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata: